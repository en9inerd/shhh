{{define "success"}}
<div class="alert alert-success">
  <strong>✅ Secret created successfully!</strong>
</div>

<div class="secret-link">
  <div class="secret-link-header">
    <strong>Shareable Link:</strong>
    <button
      type="button"
      class="btn copy-btn copy-btn-small"
      data-copy-text="{{.BaseURL}}/secret/{{.SecretID}}"
      title="Copy link"
    >
      📋 Copy
    </button>
  </div>
  <p class="secret-link-url">
    {{.BaseURL}}/secret/{{.SecretID}}
  </p>
</div>

<p class="expires-hint">
  This secret expires on <strong>{{.ExpiresAtDisplay}}</strong>.
</p>
{{end}}
