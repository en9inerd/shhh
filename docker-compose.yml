services:
  shhh:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: ${DOCKERHUB_USERNAME:-enginerd}/shhh:${VERSION:-latest}
    container_name: shhh
    restart: unless-stopped
    ports:
      - "${SHHH_PORT:-8000}:${SHHH_PORT:-8000}"
    environment:
      TZ: ${TZ:-America/New_York}
      SHHH_PORT: ${SHHH_PORT:-8000}
      SHHH_BASE_URL: ${SHHH_BASE_URL:-}
      SHHH_CORS_ORIGIN: ${SHHH_CORS_ORIGIN:-*}
      SHHH_MIN_PHRASE_SIZE: ${SHHH_MIN_PHRASE_SIZE:-5}
      SHHH_MAX_PHRASE_SIZE: ${SHHH_MAX_PHRASE_SIZE:-128}
      SHHH_MAX_ITEMS: ${SHHH_MAX_ITEMS:-100}
      SHHH_MAX_FILE_SIZE: ${SHHH_MAX_FILE_SIZE:-2097152}
      SHHH_MAX_RETENTION: ${SHHH_MAX_RETENTION:-24h}
      SHHH_VERBOSE: ${SHHH_VERBOSE:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:${SHHH_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  default:
    name: shhh-network
