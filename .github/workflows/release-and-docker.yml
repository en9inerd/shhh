name: Release & Docker

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run tests with goroutine leak detection
        env:
          GOEXPERIMENT: goroutineleakprofile
        run: go test ./...

      - name: Vet
        run: go vet ./...

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

      - name: Set up Docker Buildx
        if: steps.semrel.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.semrel.outputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        if: steps.semrel.outputs.version != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.semrel.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shhh:${{ steps.semrel.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shhh:latest

      - name: Set up Go for CLI build
        if: steps.semrel.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build CLI binaries
        if: steps.semrel.outputs.version != ''
        run: |
          mkdir -p dist
          for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64"; do
            GOOS="${platform%%/*}"
            GOARCH="${platform##*/}"
            GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags "-s -w -X main.version=v${{ steps.semrel.outputs.version }}" \
              -o "dist/shhh-cli-${GOOS}-${GOARCH}" \
              ./cmd/shhh-cli
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload CLI binaries to release
        if: steps.semrel.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.semrel.outputs.version }}" \
            dist/shhh-cli-linux-amd64 \
            dist/shhh-cli-linux-arm64 \
            dist/shhh-cli-darwin-amd64 \
            dist/shhh-cli-darwin-arm64 \
            dist/SHA256SUMS

      - name: Update Homebrew formula
        if: steps.semrel.outputs.version != ''
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          bash scripts/update-homebrew-formula.sh \
            "${{ steps.semrel.outputs.version }}" \
            dist \
            "https://x-access-token:${TAP_REPO_TOKEN}@github.com/en9inerd/homebrew-tap.git"
